name: Reliability Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix-test:
    name: Test Trino ${{ matrix.trino-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trino-version: [481, 482, 483]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test -PtrinoVersion=${{ matrix.trino-version }}

      - name: Run e2e tests
        run: ./gradlew e2eTest -PtrinoVersion=${{ matrix.trino-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.trino-version }}
          path: |
            build/test-results/
            build/reports/tests/
          retention-days: 7

  install-smoke:
    name: Install Smoke Test (Trino 483)
    runs-on: ubuntu-latest
    needs: matrix-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew build -PtrinoVersion=483

      - name: Run install-smoke test
        run: ./gradlew installSmokeTest -PtrinoVersion=483

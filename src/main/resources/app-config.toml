# Конфигурация плагина DistDoc (секции [app], [trace], [format]).
# Ресурс внутренний и контролируемый: CoreSettings ([app]), TraceSettings ([trace]) и FormatSettings ([format])
# через AppConfig при любой ошибке чтения/парсинга бросают IllegalStateException —
# дефолтов в коде нет.
# Правила совпадения путей — docs/testing/tracing.md (раздел "Правила совпадения путей при сборе значения").

[app]
# Полная версия плагина (X.Y.Z). Подставляется Gradle при сборке из gradle.properties
# (distdocVersion — единственное место хранения версии). В rx-data попадает только
# major.minor: сокращение выполняет класс CoreSettings.
distdoc_version = "@distdocVersion@"

[trace]
# Сколько идентификаторов хранить на путь (обычные узлы и аномалии — одинаково)
max_ids = 2

# Максимальная длина одного id-значения в отчёте, символов
max_id_length = 128

# Ранжированный пресет id-путей: применяется ТОЛЬКО первое совпавшее поле
# по порядку приоритета (пути от корня документа, без "$.")
preset = ["_id.$oid", "_id", "id", "uuid", "guid", "oid"]

# Суффикс-правило — FALLBACK: применяется только если ни одно поле пресета не совпало.
# Поле верхнего уровня, оканчивающееся на "_id"
suffix = "_id"

[format]
# Суффиксы имени поля, дающие контекст numeric timestamp (docs/adr/0006-format-detection.md).
# Сравнивается последний значимый слог пути ($date/$numberLong/$oid и [*] пропускаются),
# endsWith с учётом регистра. Строковые форматы от hints не зависят.
# Env DISTDOC_FORMAT_PATH_HINTS (CSV) полностью заменяет пресет.
path_hints = ["_at", "_utc"]

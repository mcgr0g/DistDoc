# Прод-Trino как read-only каталог `remote` через коннектор trino2trino.
# Trino подставляет переменные окружения в конфигах каталогов синтаксисом ${ENV:...}.
# Локальное имя каталога на shadow ВСЕГДА `remote` (имя этого файла); удалённый каталог
# прода (например, lakehouse) живёт только внутри connection-url — в SQL он не используется.
connector.name=trino
connection-url=${ENV:REMOTE_TRINO_URL}
connection-user=${ENV:REMOTE_USER}
connection-password=${ENV:REMOTE_PASSWORD}

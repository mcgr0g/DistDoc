# Нейтральный конфиг trino-cli для задач репозитория (задаётся через TRINO_CONFIG в mise.toml).
#
# Зачем он нужен: trino-cli 483 (io.trino.cli.Trino#getConfigSearchPaths) берёт значения по умолчанию для опций
# из первого СУЩЕСТВУЮЩЕГО файла цепочки TRINO_CONFIG -> ~/.trino_config -> $XDG_CONFIG_HOME/trino/config
# и валидирует ключи файла как имена опций (ValidatingPropertiesDefaultProvider).
# Флаги задач перекрывают server/user/catalog/schema, но не перекрывают то, чего нет в командной строке:
# пользовательский `external-authentication=true` оставался включённым, и io.trino.client.uri.HttpClientFactory
# падал на http-сервере с "TLS/SSL required for authentication using external authorization".
#
# Ключей здесь быть НЕ ДОЛЖНО: файл существует только для того, чтобы цепочка поиска остановилась на нём.
# Любой ключ, не совпадающий с именем опции CLI, приводит к "contains unknown properties" и exit 1.
